name: searchenvil

services:
  postgres:
    image: postgres:16-alpine
    container_name: searchenvil-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: searchenvil
      POSTGRES_PASSWORD: searchenvil_dev_password
      POSTGRES_DB: searchenvil
    ports:
      - "5433:5432"
    volumes:
      - searchenvil_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchenvil -d searchenvil"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: searchenvil-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - searchenvil_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  searchenvil_postgres_data:
  searchenvil_redis_data:
